; 售后服务平台 · PHP 目录级配置（.user.ini）
; 用于放宽上传限制：附件单文件上限 50MB。
; 说明：
;   upload_max_filesize / post_max_size 属于 PHP_INI_PERDIR，无法用 ini_set() 在运行时修改，
;   必须通过 php.ini 或目录级 .user.ini 设置（Apache/FastCGI/FPM 均支持 .user.ini）。
;   若线上用 Nginx + PHP-FPM，还需在 nginx 配置里把 client_max_body_size 调到 64M 以上，
;   否则请求会在到达 PHP 之前就被 Nginx 拒绝（返回 413）。

upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 120
